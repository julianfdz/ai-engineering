<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="400" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">El ciclo de una tool call — el modelo escribe, tu código ejecuta</text>

  <!-- Modelo -->
  <rect x="50" y="120" width="220" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">MODELO (LLM)</text>
  <text x="160" y="182" text-anchor="middle" font-size="13" fill="#1e3a8a">razona y DECIDE</text>
  <text x="160" y="205" text-anchor="middle" font-size="13" fill="#1e3a8a">qué herramienta usar</text>
  <text x="160" y="236" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">no ejecuta nada:</text>
  <text x="160" y="253" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">solo emite la intención</text>

  <!-- Tu código -->
  <rect x="590" y="120" width="220" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">TU CÓDIGO</text>
  <text x="700" y="182" text-anchor="middle" font-size="13" fill="#14532d">valida y EJECUTA</text>
  <text x="700" y="205" text-anchor="middle" font-size="13" fill="#14532d">la función real</text>
  <text x="700" y="236" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">las únicas manos</text>
  <text x="700" y="253" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">que tocan el mundo</text>

  <!-- flecha ida: la llamada -->
  <path d="M 275 160 L 585 160" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="305" y="105" width="250" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="430" y="122" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">search_budgets(</text>
  <text x="430" y="137" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">  {"query": "integración ERP"})</text>

  <!-- flecha vuelta: la observación -->
  <path d="M 585 235 L 275 235" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="305" y="248" width="250" height="40" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="430" y="265" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">resultado (o el ERROR, como</text>
  <text x="430" y="280" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#0f172a">texto, para que se autocorrija)</text>

  <!-- bucle -->
  <path d="M 120 275 C 90 330, 230 330, 200 275" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="160" y="352" text-anchor="middle" font-size="12" fill="#1e3a8a">con la observación, vuelve a decidir</text>
  <text x="160" y="369" text-anchor="middle" font-size="12" fill="#1e3a8a">(hasta que no pide más tools, o max_iterations)</text>

  <text x="700" y="330" text-anchor="middle" font-size="12" fill="#475569">contrato declarado por JSON Schema</text>
  <text x="700" y="347" text-anchor="middle" font-size="12" font-family="ui-monospace, monospace" fill="#475569">agent_tools.py · strict: true</text>
</svg>
