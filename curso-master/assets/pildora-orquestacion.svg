<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="560" fill="#f8fafc" rx="12"/>
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Orquestación de agentes — uno decide quién actúa; los demás devuelven hechos</text>
  <text x="540" y="54" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">contexto acotado + tools de mínimo privilegio por especialista · frenos en el orquestador · humano en los pasos que importan</text>

  <!-- estado compartido -->
  <rect x="40" y="82" width="250" height="56" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="165" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">ESTADO COMPARTIDO (tipado)</text>
  <text x="165" y="118" text-anchor="middle" font-size="10" fill="#334155">reducers con clave · routing_history</text>
  <text x="165" y="131" text-anchor="middle" font-size="10" fill="#334155">agent_contributions (audit trail)</text>
  <path d="M 292 110 L 336 110" stroke="#475569" stroke-width="2" marker-end="url(#arrh)" marker-start="url(#arrh)"/>

  <!-- orquestador -->
  <rect x="340" y="76" width="400" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">ORQUESTADOR · decide quién actúa y cuándo</text>
  <text x="540" y="116" text-anchor="middle" font-size="10.5" fill="#1e3a8a">descompone → delega → recoge hechos → decide el siguiente paso</text>
  <text x="540" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">🔒 frenos: presupuesto de pasos · legalidad · fallback determinista</text>

  <!-- gate humano -->
  <path d="M 744 110 L 786 110" stroke="#475569" stroke-width="2" marker-end="url(#arrh)"/>
  <text x="765" y="102" text-anchor="middle" font-size="9.5" fill="#475569">finish</text>
  <rect x="790" y="82" width="250" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="915" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">🚧 GATE HUMANO (condicional)</text>
  <text x="915" y="118" text-anchor="middle" font-size="10" fill="#78350f">interrupt() si confianza &lt; umbral</text>
  <text x="915" y="131" text-anchor="middle" font-size="10" fill="#78350f">aprobar · corregir · rechazar</text>

  <!-- delegación (azul) y vuelta (gris punteada) -->
  <path d="M 370 148 L 122 232" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 172 232 L 400 148" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>
  <path d="M 460 148 L 372 232" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 422 232 L 490 148" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>
  <path d="M 620 148 L 620 232" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 670 232 L 650 148" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>
  <path d="M 710 148 L 870 232" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 920 232 L 740 148" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>

  <text x="90" y="195" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">delega</text>
  <text x="90" y="209" text-anchor="middle" font-size="9.5" fill="#1e3a8a">Command(goto=…)</text>
  <text x="990" y="195" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">devuelve HECHOS</text>
  <text x="990" y="209" text-anchor="middle" font-size="9.5" fill="#475569">no conversación</text>

  <!-- especialistas -->
  <rect x="40" y="234" width="210" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="145" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">requirements_extractor</text>
  <text x="145" y="270" text-anchor="middle" font-size="10" fill="#166534">contexto acotado: el transcript</text>
  <text x="145" y="286" text-anchor="middle" font-size="10" fill="#166534">tools: ninguna</text>

  <rect x="290" y="234" width="210" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="395" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">budget_searcher</text>
  <text x="395" y="270" text-anchor="middle" font-size="10" fill="#166534">contexto acotado: los componentes</text>
  <text x="395" y="286" text-anchor="middle" font-size="10" fill="#166534">tools: search_budgets</text>

  <rect x="540" y="234" width="210" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">estimate_generator</text>
  <text x="645" y="270" text-anchor="middle" font-size="10" fill="#166534">contexto acotado: los matches</text>
  <text x="645" y="286" text-anchor="middle" font-size="10" fill="#166534">tools: derive_task_hours</text>

  <rect x="790" y="234" width="210" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="895" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">coherence_validator</text>
  <text x="895" y="270" text-anchor="middle" font-size="10" fill="#166534">contexto acotado: el estimate</text>
  <text x="895" y="286" text-anchor="middle" font-size="10" fill="#166534">tools: validate_estimate</text>

  <!-- fan-out paralelo dentro de estimate_generator -->
  <path d="M 645 300 L 645 312" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="540" y="314" width="210" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="645" y="329" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">⫽ fan-out / fan-in (competición)</text>
  <text x="645" y="344" text-anchor="middle" font-size="9.5" fill="#1e3a8a">conservative ∥ aggressive → synthesizer</text>

  <text x="290" y="330" text-anchor="middle" font-size="10.5" fill="#475569">3 patrones: supervisor/router (lo nuestro) · handoffs entre pares</text>
  <text x="290" y="345" text-anchor="middle" font-size="10.5" fill="#475569">· fan-out/fan-in con sintetizador · jerárquico = orquestador de orquestadores</text>

  <!-- herramientas -->
  <rect x="30" y="366" width="1020" height="146" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="540" y="386" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">CÓMO LO EMPAQUETA CADA HERRAMIENTA — quién decide · cómo aísla · cómo frena · dónde está el humano</text>

  <rect x="45" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">LangGraph</text>
  <text x="125" y="433" text-anchor="middle" font-size="9.5" fill="#334155">StateGraph + Command(goto)</text>
  <text x="125" y="448" text-anchor="middle" font-size="9.5" fill="#334155">Send fan-out · reducers</text>
  <text x="125" y="463" text-anchor="middle" font-size="9.5" fill="#334155">frenos a mano · interrupt()</text>
  <text x="125" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">(o create_supervisor prebuilt)</text>

  <rect x="212" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="292" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Claude Code</text>
  <text x="292" y="433" text-anchor="middle" font-size="9.5" fill="#334155">subagentes (Agent tool)</text>
  <text x="292" y="448" text-anchor="middle" font-size="9.5" fill="#334155">contexto propio · tools por .md</text>
  <text x="292" y="463" text-anchor="middle" font-size="9.5" fill="#334155">worktree aislado · informe</text>
  <text x="292" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">workflows = script + agentes</text>

  <rect x="379" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="459" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Hermes Agent</text>
  <text x="459" y="433" text-anchor="middle" font-size="9.5" fill="#334155">delegate_task → subagente</text>
  <text x="459" y="448" text-anchor="middle" font-size="9.5" fill="#334155">tools restringidas por hijo</text>
  <text x="459" y="463" text-anchor="middle" font-size="9.5" fill="#334155">el padre recibe el resultado</text>
  <text x="459" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">(según su documentación)</text>

  <rect x="546" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="626" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">CrewAI</text>
  <text x="626" y="433" text-anchor="middle" font-size="9.5" fill="#334155">role · goal · backstory · tasks</text>
  <text x="626" y="448" text-anchor="middle" font-size="9.5" fill="#334155">Process.sequential</text>
  <text x="626" y="463" text-anchor="middle" font-size="9.5" fill="#334155">Process.hierarchical (manager)</text>
  <text x="626" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">nuestra dicotomía, en 2 constantes</text>

  <rect x="713" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="793" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">AutoGen / AG2</text>
  <text x="793" y="433" text-anchor="middle" font-size="9.5" fill="#334155">agentes que conversan</text>
  <text x="793" y="448" text-anchor="middle" font-size="9.5" fill="#334155">GroupChat: manager elige turno</text>
  <text x="793" y="463" text-anchor="middle" font-size="9.5" fill="#334155">Magentic-One: ledger</text>
  <text x="793" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">Microsoft</text>

  <rect x="880" y="398" width="160" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="960" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">OpenAI Agents SDK</text>
  <text x="960" y="433" text-anchor="middle" font-size="9.5" fill="#334155">handoffs como tools</text>
  <text x="960" y="448" text-anchor="middle" font-size="9.5" fill="#334155">guardrails + tracing</text>
  <text x="960" y="463" text-anchor="middle" font-size="9.5" fill="#334155">heredero de Swarm</text>
  <text x="960" y="480" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">contraste: n8n = flujo fijo</text>

  <text x="540" y="538" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">La orquestación no es un framework: es decidir quién decide, con qué contexto y con qué frenos — los frameworks solo lo empaquetan</text>
</svg>
