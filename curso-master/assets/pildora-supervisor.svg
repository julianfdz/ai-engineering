<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="450" fill="#f8fafc" rx="12"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Supervisor — el modelo elige el siguiente paso; el código lo enjaula</text>
  <text x="430" y="54" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">S13: el orden vive en build.py (workflow) · S14: lo decide un LLM en caliente (sistema agéntico) — cambia quién es dueño del control flow</text>

  <!-- transcript -->
  <rect x="30" y="175" width="110" height="50" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="85" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">transcript</text>
  <text x="85" y="213" text-anchor="middle" font-size="10.5" fill="#334155">START</text>
  <path d="M 145 200 L 175 200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>

  <!-- supervisor -->
  <rect x="180" y="115" width="240" height="170" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">SUPERVISOR (router LLM)</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#1e3a8a">SupervisorDecision · Literal[5 destinos]</text>
  <text x="300" y="173" text-anchor="middle" font-size="10.5" fill="#1e3a8a">lee el estado → elige → Command(goto=…)</text>
  <rect x="195" y="185" width="210" height="88" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="300" y="204" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">LA JAULA — tres frenos</text>
  <text x="207" y="223" font-size="10.5" fill="#7f1d1d">1 · presupuesto: MAX_STEPS = 8</text>
  <text x="207" y="240" font-size="10.5" fill="#7f1d1d">2 · legalidad: inputs listos, sin repetir</text>
  <text x="207" y="257" font-size="10.5" fill="#7f1d1d">3 · fallback determinista (_fallback_next)</text>
  <text x="300" y="269" text-anchor="middle" font-size="9.5" font-style="italic" fill="#991b1b">source = llm | fallback | limit</text>

  <!-- aristas dinámicas -->
  <path d="M 420 150 C 480 150, 500 106, 555 106" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 420 170 C 480 170, 500 154, 555 154" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 420 200 C 480 200, 500 202, 555 202" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 420 230 C 480 230, 500 250, 555 250" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <path d="M 420 255 C 480 255, 500 298, 555 298" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
  <text x="488" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">5 aristas DINÁMICAS</text>

  <!-- agentes de mínimo privilegio -->
  <text x="675" y="80" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">ESPECIALISTAS DE MÍNIMO PRIVILEGIO (una tool cada uno)</text>
  <rect x="560" y="88" width="230" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="572" y="103" font-size="11.5" font-weight="700" fill="#14532d">requirements_extractor</text>
  <text x="572" y="117" font-size="10" fill="#166534">sin tools — solo estructura</text>
  <rect x="560" y="136" width="230" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="572" y="151" font-size="11.5" font-weight="700" fill="#14532d">budget_searcher</text>
  <text x="572" y="165" font-size="10" fill="#166534">tool: search_budgets</text>
  <rect x="560" y="184" width="230" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="572" y="199" font-size="11.5" font-weight="700" fill="#14532d">estimate_generator</text>
  <text x="572" y="213" font-size="10" fill="#166534">tool: derive_task_hours</text>
  <rect x="560" y="232" width="230" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="572" y="247" font-size="11.5" font-weight="700" fill="#14532d">coherence_validator</text>
  <text x="572" y="261" font-size="10" fill="#166534">tool: validate_estimate → confidence</text>
  <rect x="560" y="280" width="230" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="572" y="295" font-size="11.5" font-weight="700" fill="#78350f">finish → 🚧 human_review_gate</text>
  <text x="572" y="309" font-size="10" fill="#92400e">interrupt() solo si hay señal → END</text>

  <!-- vuelta estática -->
  <path d="M 675 268 L 675 268" stroke="none"/>
  <path d="M 795 106 C 830 106, 830 335, 675 335 L 300 335 L 300 290" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>
  <path d="M 795 154 L 812 154" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 795 202 L 815 202" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 795 250 L 816 250" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="500" y="349" text-anchor="middle" font-size="10.5" fill="#475569">aristas ESTÁTICAS de vuelta: cada especialista escribe sus hechos en el estado y devuelve el control</text>

  <!-- audit trail -->
  <rect x="30" y="368" width="800" height="48" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="387" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">AUDIT TRAIL — dos acumuladores con clave (idempotentes en el resume)</text>
  <text x="430" y="405" text-anchor="middle" font-size="10.5" fill="#334155">routing_history: una fila por decisión (paso · destino · razón · source) · agent_contributions: una fila por acción (agente · tool · resultado · digest SHA-256)</text>

  <text x="430" y="438" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Demo local: 5 decisiones, todas [llm], sin que la jaula tuviera que intervenir — pero la jaula está ahí para el día que haga falta</text>
</svg>
