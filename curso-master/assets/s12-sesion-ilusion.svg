<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">La "sesión" es una ilusión que construye tu backend</text>

  <!-- backend -->
  <rect x="45" y="70" width="250" height="330" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">TU BACKEND</text>
  <text x="170" y="122" text-anchor="middle" font-size="12.5" fill="#14532d">guarda el historial (BBDD, Redis...)</text>
  <rect x="75" y="140" width="190" height="130" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="170" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">historial de la sesión</text>
  <text x="170" y="186" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">U1: "estima esto"</text>
  <text x="170" y="205" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">A1: "45.000€..."</text>
  <text x="170" y="224" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">U2: "¿y sin la app?"</text>
  <text x="170" y="243" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#475569">A2: "38.000€..."</text>
  <text x="170" y="300" text-anchor="middle" font-size="12" fill="#14532d">en cada turno REENVÍA</text>
  <text x="170" y="318" text-anchor="middle" font-size="12" fill="#14532d">todo (o un resumen)</text>
  <text x="170" y="345" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">S5: chat_sessions + dict en RAM</text>
  <text x="170" y="363" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">S13: checkpointer en Postgres</text>

  <!-- modelo -->
  <rect x="565" y="70" width="250" height="330" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="690" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">EL MODELO</text>
  <text x="690" y="122" text-anchor="middle" font-size="12.5" fill="#1e3a8a">SIN estado, sin conexión abierta</text>
  <rect x="595" y="140" width="190" height="105" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="690" y="166" text-anchor="middle" font-size="12" fill="#334155">en cada llamada:</text>
  <text x="690" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">nace → lee TODO lo</text>
  <text x="690" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">enviado → responde</text>
  <text x="690" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">→ olvida</text>
  <text x="690" y="285" text-anchor="middle" font-size="12" fill="#1e3a8a">si "recuerda" el turno 1 es</text>
  <text x="690" y="303" text-anchor="middle" font-size="12" fill="#1e3a8a">porque se lo acabas de mandar</text>
  <text x="690" y="345" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">excepción moderna: Responses API</text>
  <text x="690" y="363" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">store=true (estado en el proveedor)</text>

  <!-- llamadas -->
  <path d="M 300 150 L 560 150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">llamada 1: [system, U1]</text>

  <path d="M 300 220 L 560 220" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <text x="430" y="212" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">llamada 2: [system, U1, A1, U2]</text>

  <path d="M 300 290 L 560 290" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <text x="430" y="282" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">llamada 3: [system, U1, A1, U2, A2, U3]</text>

  <text x="430" y="330" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="600">cada llamada es independiente — y se factura entera</text>

  <text x="430" y="432" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">La ventana de contexto no es la sesión: es el TECHO de cuánto historial cabe por llamada</text>
</svg>
