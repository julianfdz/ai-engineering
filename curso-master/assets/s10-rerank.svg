<text x="288.0" y="257.1" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">Recall</text>
<text x="288.0" y="272.0" font-size="11" fill="#1e3a8a" text-anchor="middle">top 50 (bi-encoder)</text>
<line x1="370.0" y1="261.0" x2="380.0" y2="261.0" stroke="#475569" stroke-width="2.2"/>
<polygon points="390.0,261.0 380.0,266.5 380.0,255.5" fill="#475569"/>
<rect x="392.0" y="236.0" width="160.0" height="50.0" rx="8" fill="#ede9fe" fill-opacity="1.0" stroke="#7c3aed" stroke-width="1.5"/>
<text x="472.0" y="257.1" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="700">Rerank</text>
<text x="472.0" y="272.0" font-size="11" fill="#4c1d95" text-anchor="middle">cross-encoder sobre 50</text>
<line x1="554.0" y1="261.0" x2="564.0" y2="261.0" stroke="#475569" stroke-width="2.2"/>
<polygon points="574.0,261.0 564.0,266.5 564.0,255.5" fill="#475569"/>
<rect x="576.0" y="236.0" width="160.0" height="50.0" rx="8" fill="#dcfce7" fill-opacity="1.0" stroke="#16a34a" stroke-width="1.5"/>
<text x="656.0" y="257.1" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Top-N</text>
<text x="656.0" y="272.0" font-size="11" fill="#14532d" text-anchor="middle">los 5 mejores</text>
<rect x="24.0" y="298.0" width="712.0" height="50.0" rx="8" fill="#fef3c7" fill-opacity="1.0" stroke="#d97706" stroke-width="1.5"/>
<text x="380.0" y="318.0" font-size="10.5" fill="#78350f" text-anchor="middle" font-weight="700">Coste: ~80 s la primera vez (carga del modelo) y luego cientos de ms. Calentar antes de clase.</text>
<text x="380.0" y="336.0" font-size="10.5" fill="#78350f" text-anchor="middle">En el arnés: +2,6 s sobre el vectorial. En las horas por tarea: menos filas rojas.</text>
<rect x="20.0" y="354.0" width="720.0" height="32.0" rx="8" fill="#f1f5f9" fill-opacity="1.0" stroke="#94a3b8" stroke-width="1"/>
<text x="380.0" y="375.0" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">cross-encoder/mmarco-mMiniLMv2-L12-H384-v1 · multilingüe · CPU · off por defecto</text>
</svg>