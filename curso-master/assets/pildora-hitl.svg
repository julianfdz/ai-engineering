<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Human-in-the-loop — la máquina propone, el humano dispone (en los pasos que importan)</text>

  <rect x="40" y="90" width="180" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">AGENTE</text>
  <text x="130" y="145" text-anchor="middle" font-size="11.5" fill="#1e3a8a">trabaja y PROPONE</text>

  <path d="M 225 130 L 295 130" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>
  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#475569">propuesta</text>

  <rect x="300" y="75" width="260" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="430" y="103" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">🚧 GATE HUMANO</text>
  <text x="430" y="126" text-anchor="middle" font-size="11.5" fill="#78350f">el flujo SE PARA y espera</text>
  <text x="430" y="145" text-anchor="middle" font-size="11.5" fill="#78350f">aprobar · corregir · rechazar</text>
  <text x="430" y="170" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">minutos o días — por eso hace falta checkpoint</text>

  <path d="M 565 130 L 635 130" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>
  <text x="600" y="120" text-anchor="middle" font-size="10.5" fill="#475569">decisión</text>

  <rect x="640" y="90" width="180" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">CONTINÚA</text>
  <text x="730" y="145" text-anchor="middle" font-size="11.5" fill="#14532d">con lo aprobado/corregido</text>

  <path d="M 730 175 C 730 235, 130 235, 130 175" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrh)"/>
  <text x="430" y="243" text-anchor="middle" font-size="11" fill="#1e3a8a">si hay más fases, vuelta a trabajar — con la corrección humana ya incorporada</text>

  <text x="430" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Nuestro wizard: estructura → 🚧 revisión → horas → 🚧 validación · en LangGraph: interrupt() / Command(resume=…)</text>
</svg>
