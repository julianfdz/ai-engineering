<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="470" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Anatomía de un notebook — documento y programa a la vez</text>

  <!-- el documento -->
  <rect x="50" y="60" width="500" height="360" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">mi-experimento.ipynb</text>

  <!-- celda markdown -->
  <rect x="75" y="100" width="450" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="95" y="123" font-size="12.5" font-weight="700" fill="#78350f">CELDA DE TEXTO (markdown)</text>
  <text x="95" y="145" font-size="12" font-style="italic" fill="#78350f">## Probamos el agente con otro brief…</text>

  <!-- celda código 1 -->
  <rect x="75" y="172" width="450" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="195" font-size="12.5" font-weight="700" fill="#1e3a8a">CELDA DE CÓDIGO  ▶ se ejecuta con Shift+Enter</text>
  <text x="95" y="217" font-size="12" font-family="ui-monospace, monospace" fill="#1e3a8a">respuesta = run_agent(brief)</text>

  <!-- salida -->
  <rect x="75" y="240" width="450" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="263" font-size="12.5" font-weight="700" fill="#64748b">SALIDA — queda pegada bajo su celda</text>
  <text x="95" y="284" font-size="12" font-family="ui-monospace, monospace" fill="#64748b">STEP 1  action: search_tasks({...})</text>

  <!-- celda código 2 -->
  <rect x="75" y="307" width="450" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="95" y="330" font-size="12.5" font-weight="700" fill="#1e3a8a">OTRA CELDA — usa lo de arriba</text>
  <text x="95" y="352" font-size="12" font-family="ui-monospace, monospace" fill="#1e3a8a">print(respuesta)   # 'respuesta' sigue viva</text>

  <text x="300" y="400" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">texto + código + resultados, en un solo fichero que se comparte entero</text>

  <!-- kernel -->
  <rect x="610" y="130" width="210" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">EL KERNEL</text>
  <text x="715" y="185" text-anchor="middle" font-size="12" fill="#14532d">un Python vivo que ejecuta</text>
  <text x="715" y="203" text-anchor="middle" font-size="12" fill="#14532d">las celdas y RECUERDA</text>
  <text x="715" y="221" text-anchor="middle" font-size="12" fill="#14532d">las variables entre ellas</text>
  <rect x="635" y="240" width="160" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="715" y="261" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">brief = "..."</text>
  <text x="715" y="279" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">respuesta = "..."</text>

  <path d="M 555 200 L 605 200" stroke="#475569" stroke-width="2.5" marker-end="url(#arrn)"/>
  <path d="M 605 250 L 555 250" stroke="#475569" stroke-width="2.5" marker-end="url(#arrn)"/>
  <text x="580" y="190" text-anchor="middle" font-size="10.5" fill="#475569">código</text>
  <text x="580" y="268" text-anchor="middle" font-size="10.5" fill="#475569">resultado</text>

  <text x="715" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">⚠ el estado vive en el kernel,</text>
  <text x="715" y="363" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">no en el fichero: reiniciar</text>
  <text x="715" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">= empezar de cero</text>

  <text x="430" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">El superpoder: ejecutar un trozo, MIRAR el resultado, ajustar y seguir — sin relanzar el programa entero</text>
</svg>
