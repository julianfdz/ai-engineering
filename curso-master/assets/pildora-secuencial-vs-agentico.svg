<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="560" fill="#f8fafc" rx="12"/>
  <text x="540" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Secuencial vs agéntico — ¿quién decide el siguiente paso?</text>
  <text x="540" y="54" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Receta: pasos numerados, quien cocina ejecuta · Cocinero con objetivo: mira la nevera (estado) y decide el siguiente movimiento</text>

  <!-- separador de carriles -->
  <path d="M 540 70 L 540 322" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- CARRIL IZQUIERDO: secuencial -->
  <text x="275" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">SECUENCIAL / DETERMINISTA — el código decide</text>
  <text x="275" y="101" text-anchor="middle" font-size="10.5" fill="#475569">el orden se escribe en tiempo de autor</text>

  <rect x="40" y="112" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="90" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">reformulate</text>
  <text x="90" y="146" text-anchor="middle" font-size="9.5" fill="#475569">paso 1</text>
  <path d="M 142 134 L 158 134" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>
  <rect x="160" y="112" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="210" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">retrieve</text>
  <text x="210" y="146" text-anchor="middle" font-size="9.5" fill="#475569">paso 2</text>
  <path d="M 262 134 L 278 134" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>
  <rect x="280" y="112" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="330" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">assemble</text>
  <text x="330" y="146" text-anchor="middle" font-size="9.5" fill="#475569">paso 3</text>
  <path d="M 382 134 L 398 134" stroke="#475569" stroke-width="2.5" marker-end="url(#arrh)"/>
  <rect x="400" y="112" width="100" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="450" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">generate</text>
  <text x="450" y="146" text-anchor="middle" font-size="9.5" fill="#475569">paso 4</text>

  <text x="275" y="182" text-anchor="middle" font-size="11" font-style="italic" fill="#334155">misma entrada → mismo camino, siempre</text>
  <text x="275" y="200" text-anchor="middle" font-size="11" fill="#334155">se testea EL CAMINO: un test por paso</text>

  <rect x="40" y="216" width="460" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="270" y="233" text-anchor="middle" font-size="10.5" fill="#334155">S9–S11: app/generation/rag/estimator.py (pipeline RAG)</text>
  <text x="270" y="249" text-anchor="middle" font-size="10.5" fill="#334155">S13: build.py → add_edge(retrieve, assemble) — grafo con orden fijo</text>

  <text x="275" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">+ barato · + rápido · + testeable</text>
  <text x="275" y="303" text-anchor="middle" font-size="10.5" fill="#475569">correcto cuando el orden NO depende de la entrada</text>

  <!-- CARRIL DERECHO: agéntico -->
  <text x="810" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">AGÉNTICO — el modelo decide</text>
  <text x="810" y="101" text-anchor="middle" font-size="10.5" fill="#1e3a8a">el siguiente paso se elige en caliente, según estado y objetivo</text>

  <rect x="580" y="108" width="128" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">search_budgets</text>
  <rect x="912" y="108" width="128" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="976" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">derive_task_hours</text>
  <rect x="580" y="206" width="128" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="644" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">validate_estimate</text>
  <rect x="912" y="206" width="128" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="976" y="228" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">finish → 🚧 gate</text>

  <rect x="732" y="140" width="156" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="810" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">MODELO</text>
  <text x="810" y="180" text-anchor="middle" font-size="10" fill="#1e3a8a">lee estado + objetivo</text>
  <text x="810" y="195" text-anchor="middle" font-size="10" fill="#1e3a8a">→ elige el siguiente paso</text>

  <path d="M 732 156 L 712 132" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <path d="M 888 156 L 908 132" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <path d="M 732 192 L 712 216" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <path d="M 888 192 L 908 216" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrb)"/>

  <text x="810" y="258" text-anchor="middle" font-size="10.5" fill="#1e3a8a">run 1: search → derive → validate → finish</text>
  <text x="810" y="273" text-anchor="middle" font-size="10.5" fill="#1e3a8a">run 2: search → search → derive → finish — camino distinto, mismo objetivo</text>

  <rect x="580" y="284" width="460" height="34" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="810" y="298" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">🔒 FRENOS: MAX_STEPS · legalidad · fallback determinista · 🚧 gate humano</text>
  <text x="810" y="311" text-anchor="middle" font-size="9.5" font-style="italic" fill="#991b1b">se testea por INVARIANTES, no por camino</text>

  <!-- FRANJA: qué ganas / qué pagas -->
  <text x="540" y="345" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">QUÉ GANAS · QUÉ PAGAS al pasar de pipeline a agente</text>

  <rect x="30" y="356" width="505" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="45" y="376" font-size="11.5" font-weight="700" fill="#14532d">GANAS</text>
  <text x="45" y="396" font-size="10.5" fill="#166534">· adaptación a inputs heterogéneos (ORBITA: componentes con y sin precedente)</text>
  <text x="45" y="414" font-size="10.5" fill="#166534">· nº de búsquedas y orden elegidos por caso, no fijados en tiempo de autor</text>
  <text x="45" y="432" font-size="10.5" fill="#166534">· recuperación: el modelo ve el error de una tool y se corrige</text>
  <text x="45" y="450" font-size="10.5" fill="#166534">· una sola implementación para muchos tipos de entrada</text>

  <rect x="545" y="356" width="505" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="376" font-size="11.5" font-weight="700" fill="#78350f">PAGAS</text>
  <text x="560" y="396" font-size="10.5" fill="#92400e">· no determinismo: el camino cambia por run → se testea por invariantes</text>
  <text x="560" y="414" font-size="10.5" fill="#92400e">· coste y latencia variables: cada decisión es una llamada al modelo</text>
  <text x="560" y="432" font-size="10.5" fill="#92400e">· frenos obligatorios: max_iterations / MAX_STEPS, legalidad, fallback</text>
  <text x="560" y="450" font-size="10.5" fill="#92400e">· trazas para auditar el camino y gates humanos donde el error es caro</text>

  <text x="540" y="500" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Regla: si la secuencia es estable, pipeline (S9–S11). Agente solo cuando el orden de los pasos depende de la entrada.</text>
  <text x="540" y="522" text-anchor="middle" font-size="11" fill="#475569">Escalera del proyecto: S9–S11 pipeline RAG → S12 bucle a mano → S13 grafo lineal LangGraph → S14 supervisor (el modelo decide, enjaulado)</text>
  <text x="540" y="543" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">«En un pipeline, el control de flujo vive en el código. En un agente, el control de flujo vive en el modelo.» — S12</text>
</svg>
