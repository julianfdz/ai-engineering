<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="430" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Catálogo de fuentes — inventariar ANTES de vectorizar</text>

  <!-- fuentes -->
  <text x="110" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">FUENTES QUE TE DAN</text>
  <rect x="35" y="90" width="150" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">presupuestos JSON</text>
  <text x="110" y="126" text-anchor="middle" font-size="10.5" fill="#475569">Drive</text>
  <rect x="35" y="146" width="150" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">transcripciones TXT</text>
  <text x="110" y="182" text-anchor="middle" font-size="10.5" fill="#475569">Dropbox · 3 años</text>
  <rect x="35" y="202" width="150" height="46" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">tarifas XLSX</text>
  <text x="110" y="238" text-anchor="middle" font-size="10.5" fill="#475569">"¿sigue vigente?"</text>

  <!-- censo -->
  <path d="M 192 170 L 232 170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrk)"/>
  <rect x="238" y="82" width="190" height="176" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="333" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0c4a6e">1 · CENSO (facts)</text>
  <text x="333" y="128" text-anchor="middle" font-size="11" fill="#0c4a6e">dónde vive · formato · volumen</text>
  <text x="333" y="146" text-anchor="middle" font-size="11" fill="#0c4a6e">owner técnico · owner de negocio</text>
  <text x="333" y="164" text-anchor="middle" font-size="11" fill="#0c4a6e">periodicidad declarada</text>
  <text x="333" y="182" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">vs observada</text>
  <text x="333" y="210" text-anchor="middle" font-size="10.5" fill="#0369a1">lo mide un script:</text>
  <text x="333" y="226" text-anchor="middle" font-size="10.5" fill="#0369a1">cero opiniones</text>

  <!-- calidad -->
  <path d="M 433 170 L 468 170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrk)"/>
  <rect x="474" y="82" width="175" height="176" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="561" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">2 · CALIDAD (1–5)</text>
  <text x="561" y="130" text-anchor="middle" font-size="11.5" fill="#78350f">completitud</text>
  <text x="561" y="150" text-anchor="middle" font-size="11.5" fill="#78350f">consistencia</text>
  <text x="561" y="170" text-anchor="middle" font-size="11.5" fill="#78350f">actualidad</text>
  <text x="561" y="190" text-anchor="middle" font-size="11.5" fill="#78350f">fiabilidad</text>
  <text x="561" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">NO se promedia:</text>
  <text x="561" y="234" text-anchor="middle" font-size="10.5" fill="#92400e">una dimensión baja envenena</text>

  <!-- decisión -->
  <path d="M 654 170 L 684 170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrk)"/>
  <text x="760" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">3 · DECISIÓN</text>
  <rect x="690" y="90" width="140" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">include</text>
  <text x="760" y="126" text-anchor="middle" font-size="10.5" fill="#166534">entra al pipeline</text>
  <rect x="690" y="146" width="140" height="46" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="760" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">review</text>
  <text x="760" y="182" text-anchor="middle" font-size="10.5" fill="#854d0e">pendiente · con motivo</text>
  <rect x="690" y="202" width="140" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="760" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">exclude</text>
  <text x="760" y="238" text-anchor="middle" font-size="10.5" fill="#991b1b">fuera · con motivo</text>

  <!-- YAML -->
  <rect x="140" y="290" width="580" height="96" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#3b0764">data_catalog.yaml — versionado en git, validado al arrancar</text>
  <text x="430" y="340" text-anchor="middle" font-size="11.5" fill="#4c1d95">el pipeline solo ingiere lo que dice "include" y propaga a cada chunk su origen y su sensibilidad</text>
  <text x="430" y="362" text-anchor="middle" font-size="11.5" fill="#4c1d95">el git log del YAML = quién decidió incluir o excluir cada fuente, y por qué</text>
  <path d="M 760 254 L 760 274 L 700 290" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="430" y="410" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">El catálogo combate la "context erosion": el contexto que hace interpretable un dato se pierde al moverlo entre sistemas</text>
</svg>
