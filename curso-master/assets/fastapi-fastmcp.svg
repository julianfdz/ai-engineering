<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="440" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">La misma función, dos puertas — FastAPI para apps, FastMCP para agentes</text>

  <!-- la funcion central -->
  <rect x="330" y="170" width="200" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">TU FUNCIÓN PYTHON</text>
  <text x="430" y="222" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#14532d">def estimate(brief: str)</text>
  <text x="430" y="242" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#14532d">    -&gt; Estimate: ...</text>

  <!-- FastAPI -->
  <rect x="60" y="70" width="230" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">FastAPI</text>
  <text x="175" y="120" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#1e3a8a">@app.post("/estimate")</text>
  <text x="175" y="143" text-anchor="middle" font-size="12" fill="#1e3a8a">la expone por HTTP/REST</text>
  <text x="175" y="163" text-anchor="middle" font-size="12" fill="#1e3a8a">con validación Pydantic</text>
  <text x="175" y="183" text-anchor="middle" font-size="12" fill="#1e3a8a">y docs OpenAPI (/docs) gratis</text>
  <path d="M 295 175 L 325 195" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrf)"/>

  <!-- consumidor humano/apps -->
  <rect x="60" y="290" width="230" height="80" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">APPS Y HUMANOS</text>
  <text x="175" y="343" text-anchor="middle" font-size="11.5" fill="#475569">navegador · Rails · curl · frontend</text>
  <path d="M 175 285 L 175 215" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrf)"/>

  <!-- FastMCP -->
  <rect x="570" y="70" width="230" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="685" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">FastMCP</text>
  <text x="685" y="120" text-anchor="middle" font-size="11.5" font-family="ui-monospace, monospace" fill="#78350f">@mcp.tool</text>
  <text x="685" y="143" text-anchor="middle" font-size="12" fill="#78350f">la expone por MCP como TOOL</text>
  <text x="685" y="163" text-anchor="middle" font-size="12" fill="#78350f">con el schema generado de los</text>
  <text x="685" y="183" text-anchor="middle" font-size="12" fill="#78350f">type hints — mismo estilo DX</text>
  <path d="M 565 175 L 535 195" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrf)"/>

  <!-- consumidor agentes -->
  <rect x="570" y="290" width="230" height="80" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="685" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">AGENTES</text>
  <text x="685" y="343" text-anchor="middle" font-size="11.5" fill="#475569">Claude Code · Cursor · ChatGPT · tu agente</text>
  <path d="M 685 285 L 685 215" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrf)"/>

  <text x="430" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">REST fue la puerta para las aplicaciones; MCP es la puerta para los agentes — y el estilo de ambas librerías es el mismo</text>
</svg>
