<text x="512.0" y="226.0" font-size="10.5" fill="#4c1d95" text-anchor="start">El logit del cross-encoder puede</text>
<text x="512.0" y="242.0" font-size="10.5" fill="#4c1d95" text-anchor="start">ser negativo: × 0,5 lo «sube».</text>
<text x="512.0" y="258.0" font-size="10.5" fill="#4c1d95" text-anchor="start">sigmoid lo lleva a (0, 1) y el</text>
<text x="512.0" y="274.0" font-size="10.5" fill="#4c1d95" text-anchor="start">decaimiento solo atenúa.</text>
