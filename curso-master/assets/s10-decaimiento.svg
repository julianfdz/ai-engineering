<text x="512.0" y="112.0" font-size="10.5" fill="#14532d" text-anchor="start">Es ponderación BLANDA: solo</text>
<text x="512.0" y="128.0" font-size="10.5" fill="#14532d" text-anchor="start">desempata entre finalistas ya</text>
<text x="512.0" y="144.0" font-size="10.5" fill="#14532d" text-anchor="start">relevantes. Antes del rerank</text>
<text x="512.0" y="160.0" font-size="10.5" fill="#14532d" text-anchor="start">penalizaría lo que no sabes si sirve.</text>
