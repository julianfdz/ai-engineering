  <text x="32" y="161" font-size="10.5" fill="#334155" font-family="Consolas, Courier New, monospace">year: 2024</text>
  <text x="32" y="178" font-size="10.5" fill="#334155" font-family="Consolas, Courier New, monospace">main_technology: rails</text>
  <text x="32" y="195" font-size="10.5" fill="#334155" font-family="Consolas, Courier New, monospace">summary: "Mobile banking…"</text>
  <rect x="32" y="210" width="181" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="122" y="229" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">components[ ]</text>
