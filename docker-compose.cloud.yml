# =============================================================================
# Override CLOUD — Postgres gestionado (Neon), Redis se queda en el host
# =============================================================================
# Sustituye las DOS instancias de Postgres del compose base por bases de datos
# gestionadas (Neon u otro Postgres con pgvector ≥ 0.7), manteniendo Redis como
# contenedor: la caché semántica necesita RediSearch (Redis Stack) y los Redis
# gestionados habituales no traen ese módulo.
#
# Uso — SIEMPRE apilado sobre el base, y en producción DESPUÉS del prod (el
# último fichero gana en las claves que ambos tocan, p. ej. DATABASE_URL):
#
#     # desarrollo contra Neon
#     docker compose -f docker-compose.yml -f docker-compose.cloud.yml up
#
#     # producción (VPS): Caddy + imágenes de GHCR + BBDD en Neon
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                    -f docker-compose.cloud.yml up -d
#
# Variables nuevas (ver .env.example, sección Cloud):
#   AI_SERVICE_DATABASE_URL  — la BBDD del servicio IA (pgvector, corpus, checkpointer)
#   BUSINESS_DATABASE_URL    — la BBDD relacional de Rails
#
# Detalles que importan:
#   · Usa el endpoint DIRECTO de Neon (sin `-pooler`): ambos servicios son
#     procesos de larga vida con sus propios pools, y asyncpg + el checkpointer
#     de LangGraph usan prepared statements que el pooler en modo transacción
#     puede romper. El pooler solo compensa con muchas réplicas efímeras.
#   · `sslmode=require&channel_binding=require` en las URLs: psycopg y libpq
#     (Rails) los leen tal cual; para asyncpg el servicio IA los traduce en
#     `_async_database_url` (sslmode→ssl, channel_binding se descarta).
#   · Los volúmenes `postgres_data` / `estimator_postgres_data` no se tocan:
#     si vuelves al compose base, tus datos locales siguen ahí.
#
# Docs: docs/deploy-cloud-neon.md

services:
  business-backend:
    environment:
      # Rails fusiona ENV["DATABASE_URL"] por encima de database.yml en
      # cualquier entorno, así que esto manda también en development.
      DATABASE_URL: "${BUSINESS_DATABASE_URL:?falta BUSINESS_DATABASE_URL -- la URL de la BBDD de Rails en Neon}"

    # El servicio `postgres` ya no arranca; sin `!override` compose FUSIONARÍA
    # este mapa con el del base y seguiría esperando a un contenedor que no existe.
    depends_on: !override
      ai-service:
        condition: service_healthy

  ai-service:
    environment:
      DATABASE_URL: "${AI_SERVICE_DATABASE_URL:?falta AI_SERVICE_DATABASE_URL -- la URL de la BBDD pgvector en Neon}"

    depends_on: !override
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Las dos bases de datos locales quedan fuera del arranque por defecto.
  # `docker compose --profile local-db up postgres vector-db` las recupera si
  # algún día hace falta volver a mirar los datos de los volúmenes locales.
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["local-db"]

  vector-db:
    profiles: ["local-db"]
