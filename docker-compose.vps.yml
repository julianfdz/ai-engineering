# =============================================================================
# Override VPS/PORTAINER — build en la máquina, sin imágenes de CI, sin .env
# =============================================================================
# Para un VPS gestionado con Portainer donde NO hay imágenes publicadas en un
# registry: aquí se CONSTRUYE en la máquina (a diferencia de docker-compose.prod.yml,
# que hace `build: !reset null` y espera las imágenes de CI — con ese override y
# sin imágenes, compose falla con "has neither an image nor a build context").
#
# Pila (SIN el prod; este fichero asume su papel):
#
#     docker-compose.yml + docker-compose.cloud.yml + docker-compose.vps.yml
#
# En Portainer (stack tipo Repository): apunta al fork, compose path
# `docker-compose.yml`, y los otros dos en "Additional paths" EN ESE ORDEN.
# Variables: defínelas en la sección Environment variables del stack (las del
# .env de despliegue). Este override elimina el `env_file: .env` del base
# (`!reset` — el .env está gitignorado y no existe en el clon de Portainer) y
# pasa explícitamente las variables que cada contenedor necesita.
#
# Reverse proxy: publica Rails SOLO en loopback (127.0.0.1:3001). Si tu proxy
# corre EN UN CONTENEDOR (proxeas por nombre de servicio), su 127.0.0.1 no es
# el del host: descomenta los bloques `networks:` de abajo, pon el nombre real
# de la red de tu proxy, y en tu Caddyfile usa
#     reverse_proxy business-backend:3000
#
# La primera build del servicio IA es pesada (~4,9 GB, torch): dale disco y,
# si el VPS anda justo de RAM, swap.

services:
  business-backend:
    # El Dockerfile de Rails compila Tailwind en build; sin este build-arg la
    # imagen resultante es de DESARROLLO (es el mismo trap que cubre el job
    # `build` del CI con build-args: RAILS_ENV=production).
    build:
      context: ./business-backend
      args:
        RAILS_ENV: production

    env_file: !reset []

    ports: !override
      - "127.0.0.1:3001:3000"

    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "true"
      # Sin esto Rails responde 403 a todo (y /up sigue verde).
      RAILS_ALLOWED_HOSTS: "${APP_DOMAIN:?falta APP_DOMAIN -- el dominio que sirve tu proxy}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?falta SECRET_KEY_BASE -- generalo con openssl rand -hex 64}"
      # Rails ENVÍA este token al servicio IA en cada llamada.
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-}"

    volumes:
      # Active Storage: sin volumen, los adjuntos mueren en cada redeploy.
      - active_storage:/rails/storage

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    # networks:
    #   - default
    #   - proxy   # la red donde vive tu Caddy contenedorizado

  ai-service:
    env_file: !reset []

    environment:
      APP_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?falta OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # FastAPI VALIDA este token; vacío = middleware desactivado.
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-}"
      RETRIEVAL_API_KEY: "${RETRIEVAL_API_KEY:-}"
      ESTIMATE_API_KEY: "${ESTIMATE_API_KEY:-}"
      PRIMARY_MODEL: "${PRIMARY_MODEL:-gpt-4o-mini}"
      FALLBACK_MODEL: "${FALLBACK_MODEL:-claude-haiku-4-5-20251001}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      LOGFIRE_SERVICE_NAME: "${LOGFIRE_SERVICE_NAME:-estimator}"

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    # Misma RediSearch que redis-stack pero sin la UI web del 8001.
    image: redis/redis-stack-server:7.4.0-v0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  active_storage:

# Red externa del reverse proxy del host — descomenta junto con el bloque
# `networks:` de business-backend y pon el nombre real (docker network ls).
# networks:
#   proxy:
#     external: true
